# Builds the static dashboard export and deploys it to GitHub Pages.
# Replay-only: no API key, no Claude calls (REPLAY=1; briefs come from the committed response cache).
# Synthetic data — not Opendoor data.
name: Deploy dashboard to Pages

# Manual only until Pages is enabled in the repository settings; add `push: branches: [main]` to deploy on push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}  # login shell, so the conda env is on PATH
    env:
      REPLAY: "1"
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: margin-radar
          auto-activate-base: false
          miniforge-version: latest  # conda-forge only; avoids the defaults channel
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Data, governed metrics and static export (replay; briefs are committed)
        run: make export
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
