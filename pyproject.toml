[project]
name = "margin-radar"
version = "0.1.0"
description = "Cohort early-warning agent prototype. Synthetic data — not Opendoor data."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not slow'"
markers = ["slow: multi-seed sweeps (run with -m slow)"]
